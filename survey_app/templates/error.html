{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger">Ошибка {{ code }}</h1>
    <p class="lead">{{ message }}</p>
    <div class="mt-4">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">На главную</a>
    </div>
</div>
{% endblock %}
